<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set new password | The Grass Wiz</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="theme-grasswiz auth-page">

<main class="auth-card">
  <div class="auth-brand"><div class="brand-mark">GW</div><h1>THE GRASS WIZ</h1></div>
  <h2>Set a new password</h2>
  <p class="auth-sub">Choose a password of at least 8 characters.</p>

  <div class="auth-msg" id="msg" role="alert"></div>

  <form id="resetForm" novalidate>
    <div class="auth-field">
      <label for="password">New password</label>
      <input type="password" id="password" autocomplete="new-password" required minlength="8">
    </div>
    <div class="auth-field">
      <label for="password2">Confirm password</label>
      <input type="password" id="password2" autocomplete="new-password" required minlength="8">
    </div>
    <button type="submit" class="primary block" id="submitBtn">Update password</button>
  </form>
  <button type="button" class="auth-link" onclick="location.href='login.html'">Back to sign in</button>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
